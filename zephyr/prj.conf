# Logging config
# Logs must never reach the CDC ACM endpoint: it carries bridged UART traffic,
# so console output would be injected into the byte stream the PC is reading.
# Send them to RTT (J-Link) instead. Deferred mode keeps formatting out of the
# ISR path, which matters at 1 Mbaud where a byte lands every ~10 us.
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
# Drop rather than block when no RTT viewer is attached, so the bridge runs
# standalone without the log thread stalling on a full buffer.
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_USB_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USB_DEVICE_LOG_LEVEL_ERR=y
#CONFIG_LOG_PRINTK=n

# USB config
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Zephyr USB console sample"
CONFIG_USB_DEVICE_MANUFACTURER="ZEPHYR"
CONFIG_USB_DEVICE_PID=0x0004
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

# Console config
# UART_CONSOLE=n detaches the console from chosen zephyr,console (the CDC ACM
# device), so nothing but bridged data goes out that endpoint.
CONFIG_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y

# UART config
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=n
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
# CDC ACM has no async support, so the USB side stays interrupt driven; usart1
# uses the async API so its RX runs off DMA instead of one interrupt per byte.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_ASYNC_API=y
CONFIG_DMA=y

CONFIG_CPP=y